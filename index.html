<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토리의 모험</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        h1 {
            font-size: 2rem;
            color: #ffca28;
        }
        canvas {
            border: 3px solid #ffffff;
            border-radius: 8px;
            background-color: #2e7d32;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .controls-info {
            font-size: 0.9rem;
            color: #aaa;
            background: #1e1e1e;
            padding: 8px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🌰 토리의 모험 🌰</h1>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="controls-info">이동: W (위) | A (왼쪽) | S (아래) | D (오른쪽)</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    const keys = {};

    const tori = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        size: 16,
        speed: 4,
        color: '#d7ccc8'
    };

    const acorn = {
        x: 0,
        y: 0,
        size: 10,
        color: '#ffb300'
    };

    function spawnAcorn() {
        acorn.x = Math.random() * (canvas.width - 40) + 20;
        acorn.y = Math.random() * (canvas.height - 40) + 20;
    }

    window.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    function update() {
        if (keys['w'] && tori.y - tori.size > 0) tori.y -= tori.speed;
        if (keys['s'] && tori.y + tori.size < canvas.height) tori.y += tori.speed;
        if (keys['a'] && tori.x - tori.size > 0) tori.x -= tori.speed;
        if (keys['d'] && tori.x + tori.size < canvas.width) tori.x += tori.speed;

        const dx = tori.x - acorn.x;
        const dy = tori.y - acorn.y;
        const distance = Math.hypot(dx, dy);

        if (distance < tori.size + acorn.size) {
            score += 10;
            spawnAcorn();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 도토리 그리기
        ctx.beginPath();
        ctx.arc(acorn.x, acorn.y, acorn.size, 0, Math.PI * 2);
        ctx.fillStyle = acorn.color;
        ctx.fill();
        ctx.closePath();

        // 토리 그리기
        ctx.beginPath();
        ctx.arc(tori.x, tori.y, tori.size, 0, Math.PI * 2);
        ctx.fillStyle = tori.color;
        ctx.fill();
        ctx.closePath();

        // 점수 출력
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(`SCORE: ${score}`, 15, 30);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    spawnAcorn();
    loop();
</script>

</body>
</html>
